name: Agents CI

on:
  push:
    branches: [main]
    paths: ["agents/**", ".github/workflows/agents-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["agents/**", ".github/workflows/agents-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest
